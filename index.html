<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL V0.5.1 | Cloud Security</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .product-card { border: 1px solid #eee; transition: 0.2s; background: white; border-radius: 15px; overflow: hidden; }
        #sideMenu { transition: 0.3s; left: -100%; z-index: 1000; }
        #sideMenu.active { left: 0; }
        .amazon-gradient { background: #131921; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #fbbf24; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <div id="sideMenu" class="fixed top-0 h-full w-72 bg-slate-900 text-white p-5 shadow-2xl overflow-y-auto">
        <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
            <h2 class="text-2xl font-black text-yellow-500 italic">GLOBAL</h2>
            <button onclick="toggleMenu()" class="text-3xl">×</button>
        </div>
        <nav class="space-y-4 font-bold">
            <button onclick="showView('catalog')" class="w-full text-left p-3 hover:bg-slate-800 rounded-lg flex items-center gap-3"><i class="fas fa-home text-yellow-500"></i> Inicio</button>
            <div class="mt-6 p-4 bg-slate-800 rounded-xl">
                <p class="text-[10px] text-gray-400 uppercase mb-3">Entrega</p>
                <label class="flex items-center gap-2 text-sm mb-3 cursor-pointer"><input type="checkbox" id="gpsToggle" checked class="accent-yellow-500"> Enviar GPS</label>
                <textarea id="manualAddress" placeholder="Dirección exacta..." class="w-full bg-slate-700 text-white text-xs p-2 rounded-lg h-20 border-none outline-none"></textarea>
            </div>
            <button onclick="accessAdmin()" class="w-full text-left p-3 text-red-400 mt-10 border-t border-gray-800 pt-6 flex items-center gap-3"><i class="fas fa-lock"></i> Panel Admin</button>
        </nav>
    </div>

    <header class="amazon-gradient text-white sticky top-0 z-50 p-4 shadow-lg">
        <div class="flex justify-between items-center max-w-6xl mx-auto">
            <button onclick="toggleMenu()" class="text-2xl"><i class="fas fa-bars"></i></button>
            <h1 class="text-2xl font-black text-yellow-500 italic">GLOBAL</h1>
            <div onclick="toggleCart()" class="relative cursor-pointer">
                <i class="fas fa-shopping-cart text-2xl"></i>
                <span id="cartCount" class="absolute -top-2 -right-2 bg-yellow-500 text-black font-black rounded-full px-1.5 text-[10px]">0</span>
            </div>
        </div>
        <input type="text" id="searchInput" onkeyup="renderLocalProducts()" placeholder="Buscar productos..." class="w-full mt-3 p-2 rounded-lg text-black outline-none">
    </header>

    <main class="max-w-6xl mx-auto p-4">
        <section id="catalogView">
            <div id="adminPanel" class="hidden bg-white p-6 rounded-2xl shadow-xl mb-8 border-2 border-yellow-500">
                <div class="flex justify-between items-center mb-6">
                    <h2 id="adminTitle" class="font-black text-lg uppercase">Gestión de Tienda</h2>
                    <button onclick="closeAdmin()" class="text-red-500 text-2xl">×</button>
                </div>

                <div class="mb-8 p-4 bg-gray-50 rounded-xl border border-dashed border-gray-300">
                    <p class="text-[10px] font-black uppercase text-gray-500 mb-2">Seguridad del Panel</p>
                    <div class="flex gap-2">
                        <input type="password" id="newAdminPass" placeholder="Nueva Contraseña" class="border p-2 rounded-lg text-sm w-full">
                        <button onclick="updatePassword()" class="bg-blue-600 text-white px-4 rounded-lg text-[10px] font-bold uppercase">Actualizar Clave</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="hidden" id="editId">
                    <input type="text" id="prodName" placeholder="Nombre del producto" class="border p-3 rounded-lg">
                    <textarea id="prodDesc" placeholder="Descripción detallada..." class="border p-3 rounded-lg md:col-span-2 h-20"></textarea>
                    <div class="flex gap-2">
                        <select id="prodCurrency" class="border p-3 rounded-lg"><option value="$">$ USD</option><option value="C$">C$ NIO</option></select>
                        <input type="number" id="prodPrice" placeholder="Precio" class="border p-3 rounded-lg w-full">
                    </div>
                    <input type="number" id="prodStock" placeholder="Stock disponible" class="border p-3 rounded-lg w-full">
                    <input type="file" id="prodFile" class="text-xs p-2 border rounded-lg w-full">
                    <input type="text" id="adminWhatsapp" placeholder="WhatsApp Receptor (Ej: 50588888888)" class="border p-3 rounded-lg w-full bg-yellow-50">
                    <button id="saveBtn" onclick="saveToFirebase()" class="md:col-span-2 bg-slate-900 text-yellow-500 p-4 rounded-xl font-black uppercase flex justify-center items-center gap-3">
                        <span id="btnText">Subir Producto</span>
                        <div id="saveLoader" class="loader"></div>
                    </button>
                </div>
                
                <div class="mt-8 overflow-x-auto">
                    <table class="w-full text-[10px] text-left border">
                        <thead class="bg-gray-100"><tr><th class="p-2 border">Item</th><th class="p-2 border text-center">Stock</th><th class="p-2 border text-center">Acciones</th></tr></thead>
                        <tbody id="adminTableBody"></tbody>
                    </table>
                </div>
            </div>
            
            <div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </section>
    </main>

    <div id="productDetailModal" class="fixed inset-0 bg-black/80 z-[1100] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl overflow-hidden shadow-2xl">
            <button onclick="closeDetail()" class="absolute top-3 right-3 bg-white rounded-full w-10 h-10 font-bold">✕</button>
            <img id="detailImg" class="w-full h-64 object-cover">
            <div class="p-6">
                <h2 id="detailTitle" class="text-2xl font-black uppercase mb-1"></h2>
                <div id="detailPrice" class="text-2xl font-bold text-orange-600 mb-4"></div>
                <p id="detailFullDesc" class="text-gray-600 text-sm mb-6"></p>
                <div id="detailActionBtn"></div>
            </div>
        </div>
    </div>

    <div id="cartModal" class="fixed right-0 top-0 h-full w-full md:w-80 bg-white shadow-2xl p-6 hidden z-[1200]">
        <div class="flex justify-between items-center mb-6 border-b pb-4"><h2 class="font-black italic">CARRITO</h2><button onclick="toggleCart()" class="text-3xl">×</button></div>
        <div id="cartItems" class="space-y-4 overflow-y-auto max-h-[60vh]"></div>
        <div class="absolute bottom-0 left-0 w-full p-6 border-t bg-gray-50">
            <div id="totalContainer" class="text-xl font-black mb-4"></div>
            <button onclick="sendOrder()" class="w-full bg-green-600 text-white py-4 rounded-xl font-black flex items-center justify-center gap-2 uppercase text-sm">
                <i class="fab fa-whatsapp text-xl"></i> Enviar Pedido
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, setDoc, getDoc } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFEw-S5KufBqeofyEqqnjCxbU7ElcqS2k",
            authDomain: "globaltienda-ad102.firebaseapp.com",
            projectId: "globaltienda-ad102",
            storageBucket: "globaltienda-ad102.firebasestorage.app",
            messagingSenderId: "221802932744",
            appId: "1:221802932744:web:ca20e8940a77164406ffbd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const prodsRef = collection(db, "productos");
        const configRef = doc(db, "configuracion", "admin");

        window.allProducts = [];
        let currentPass = "1234";

        // Obtener Contraseña desde la nube
        onSnapshot(configRef, (docSnap) => {
            if(docSnap.exists()){ currentPass = docSnap.data().password; }
        });

        // Función para cambiar contraseña
        window.updatePassword = async function() {
            const newPass = document.getElementById('newAdminPass').value;
            if(!newPass) return alert("Escribe una contraseña válida");
            try {
                await setDoc(configRef, { password: newPass });
                alert("Contraseña actualizada en la nube");
                document.getElementById('newAdminPass').value = "";
            } catch (e) { alert("Error al cambiar clave"); }
        }

        // Acceso Admin
        window.accessAdmin = function() {
            const pass = prompt("Contraseña de Administrador:");
            if (pass === currentPass) {
                document.getElementById('adminPanel').classList.remove('hidden');
                toggleMenu();
            } else { alert("Clave Incorrecta"); }
        }

        // Leer Productos
        onSnapshot(query(prodsRef, orderBy("timestamp", "desc")), (snapshot) => {
            window.allProducts = [];
            snapshot.forEach((doc) => { window.allProducts.push({ id: doc.id, ...doc.data() }); });
            renderLocalProducts();
            renderAdminTable();
        });

        // Guardar/Editar
        window.saveToFirebase = async function() {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('prodName').value;
            const desc = document.getElementById('prodDesc').value;
            const currency = document.getElementById('prodCurrency').value;
            const price = document.getElementById('prodPrice').value;
            const stock = document.getElementById('prodStock').value;
            const fileInput = document.getElementById('prodFile');
            const wa = document.getElementById('adminWhatsapp').value;

            if(!name || !price) return alert("Nombre y Precio requeridos");
            document.getElementById('saveLoader').style.display = 'block';

            const process = async (img) => {
                const data = { name, desc, currency, price, stock: stock===""?"inf":parseInt(stock), timestamp: Date.now() };
                if(img) data.img = img;
                if(id) await updateDoc(doc(db, "productos", id), data);
                else await addDoc(prodsRef, data);
                if(wa) localStorage.setItem('global_wa', wa);
                closeAdmin();
                document.getElementById('saveLoader').style.display = 'none';
            };

            if (fileInput.files[0]) {
                const r = new FileReader(); r.onload = (e) => process(e.target.result); r.readAsDataURL(fileInput.files[0]);
            } else { process(null); }
        }

        window.deleteFromFirebase = async (id) => { if(confirm("¿Eliminar?")) await deleteDoc(doc(db, "productos", id)); }
    </script>

    <script>
        let cart = [];
        function toggleMenu() { document.getElementById('sideMenu').classList.toggle('active'); }
        function toggleCart() { document.getElementById('cartModal').classList.toggle('hidden'); }
        function showView(view) { document.getElementById('catalogView').classList.toggle('hidden', view !== 'catalog'); toggleMenu(); }

        function renderLocalProducts() {
            const grid = document.getElementById('productGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';
            window.allProducts.filter(p => p.name.toLowerCase().includes(search)).forEach(p => {
                const isAgotado = (p.stock !== "inf" && p.stock <= 0);
                grid.innerHTML += `
                    <div class="product-card flex flex-col shadow-sm">
                        <img src="${p.img || 'https://via.placeholder.com/150'}" class="w-full h-36 object-cover cursor-pointer" onclick="openDetail('${p.id}')">
                        <div class="p-3">
                            <h3 class="font-bold text-[10px] uppercase line-clamp-2 h-8">${p.name}</h3>
                            <p class="text-lg font-black mt-1">${p.currency}${p.price}</p>
                            <button onclick="addToCart('${p.id}')" ${isAgotado?'disabled':''} class="w-full mt-2 py-2 rounded-lg font-bold text-[10px] uppercase ${isAgotado?'bg-gray-100 text-gray-400':'bg-yellow-400'}">${isAgotado?'AGOTADO':'AÑADIR'}</button>
                        </div>
                    </div>`;
            });
        }

        function openDetail(id) {
            const p = window.allProducts.find(prod => prod.id === id);
            document.getElementById('detailTitle').innerText = p.name;
            document.getElementById('detailImg').src = p.img || 'https://via.placeholder.com/300';
            document.getElementById('detailFullDesc').innerText = p.desc;
            document.getElementById('detailPrice').innerText = `${p.currency}${p.price}`;
            document.getElementById('detailActionBtn').innerHTML = `<button onclick="addToCart('${p.id}')" class="w-full py-4 rounded-xl font-black bg-yellow-400 shadow-lg">AÑADIR A LA BOLSA</button>`;
            document.getElementById('productDetailModal').classList.remove('hidden');
        }

        function closeDetail() { document.getElementById('productDetailModal').classList.add('hidden'); }
        function closeAdmin() { document.getElementById('adminPanel').classList.add('hidden'); resetForm(); }
        function resetForm() { document.getElementById('editId').value = ''; document.querySelectorAll('#adminPanel input, #adminPanel textarea').forEach(i => i.value = ''); }

        function addToCart(id) {
            const p = window.allProducts.find(prod => prod.id === id);
            cart.push({...p});
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const list = document.getElementById('cartItems');
            list.innerHTML = '';
            let tUSD = 0, tNIO = 0;
            cart.forEach((item, i) => {
                if(item.currency === "$") tUSD += parseFloat(item.price); else tNIO += parseFloat(item.price);
                list.innerHTML += `<div class="flex justify-between items-center text-[10px] font-bold uppercase border-b pb-2"><span>${item.name}</span><button onclick="removeFromCart(${i})" class="text-red-500">✕</button></div>`;
            });
            document.getElementById('totalContainer').innerText = (tUSD > 0 ? `$${tUSD.toFixed(2)} ` : '') + (tNIO > 0 ? `C$${tNIO.toFixed(2)}` : '');
        }

        function removeFromCart(i) { cart.splice(i, 1); updateCartUI(); }

        function sendOrder() {
            const gps = document.getElementById('gpsToggle').checked;
            const dir = document.getElementById('manualAddress').value;
            if(gps && navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => finalize(pos.coords.latitude, pos.coords.longitude, dir), () => finalize(null, null, dir));
            } else { finalize(null, null, dir); }
        }

        function finalize(lat, lon, dir) {
            const wa = localStorage.getItem('global_wa');
            let msg = `🛍️ *PEDIDO GLOBAL*%0A${cart.map(i => i.name).join('%0A')}%0A%0A*TOTAL: ${document.getElementById('totalContainer').innerText}*%0A`;
            if(dir) msg += `%0A🏠 *Dirección:* ${dir}`;
            if(lat) msg += `%0A📍 *GPS:* https://www.google.com/maps?q=${lat},${lon}`;
            window.open(`https://wa.me/${wa}?text=${msg}`, '_blank');
        }

        function renderAdminTable() {
            const tb = document.getElementById('adminTableBody');
            if(!tb) return;
            tb.innerHTML = '';
            window.allProducts.forEach(p => {
                tb.innerHTML += `<tr class="border-b"><td class="p-2">${p.name}</td><td class="p-2 text-center">${p.stock}</td><td class="p-2 text-center"><button onclick="editProduct('${p.id}')" class="text-blue-500 mr-2"><i class="fas fa-edit"></i></button><button onclick="deleteFromFirebase('${p.id}')" class="text-red-500"><i class="fas fa-trash"></i></button></td></tr>`;
            });
        }

        function editProduct(id) {
            const p = window.allProducts.find(prod => prod.id === id);
            document.getElementById('editId').value = p.id;
            document.getElementById('prodName').value = p.name;
            document.getElementById('prodDesc').value = p.desc;
            document.getElementById('prodPrice').value = p.price;
            document.getElementById('prodStock').value = p.stock;
            document.getElementById('adminTitle').innerText = "Editando Producto";
        }
    </script>
</body>
</html>
