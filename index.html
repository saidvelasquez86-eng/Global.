<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL V0.6.1 | Multi-Moneda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* AJUSTE DE IMÁGENES: Se ajustan solas sin cortarse */
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: contain; 
            background-color: #f9fafb;
            padding: 10px;
        }
        .product-card { border: 1px solid #eee; transition: 0.2s; background: white; border-radius: 15px; overflow: hidden; cursor: pointer; }
        #sideMenu { transition: 0.3s; left: -100%; z-index: 1000; }
        #sideMenu.active { left: 0; }
        .amazon-gradient { background: #131921; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #fbbf24; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <div id="sideMenu" class="fixed top-0 h-full w-72 bg-slate-900 text-white p-5 shadow-2xl z-[2000]">
        <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4 text-yellow-500 font-black text-2xl italic">GLOBAL <button onclick="toggleMenu()" class="text-white text-3xl">×</button></div>
        <nav class="space-y-4 font-bold">
            <button onclick="showView('catalog')" class="w-full text-left p-3 hover:bg-slate-800 rounded-lg flex items-center gap-3"><i class="fas fa-home text-yellow-500"></i> Inicio</button>
            <button onclick="showView('history')" class="w-full text-left p-3 hover:bg-slate-800 rounded-lg flex items-center gap-3"><i class="fas fa-history text-yellow-500"></i> Mi Historial</button>
            <div class="mt-6 p-4 bg-slate-800 rounded-xl text-xs">
                <p class="text-gray-400 uppercase mb-2 italic font-black">Mis Datos</p>
                <textarea id="manualAddress" placeholder="Escribe tu dirección aquí..." class="w-full bg-slate-700 text-white p-2 rounded-lg h-20 outline-none"></textarea>
            </div>
            <button onclick="accessAdmin()" class="w-full text-left p-3 text-red-400 mt-10 border-t border-gray-800 pt-6 flex items-center gap-3"><i class="fas fa-lock"></i> Panel Admin</button>
        </nav>
    </div>

    <header class="amazon-gradient text-white sticky top-0 z-50 p-4">
        <div class="max-w-6xl mx-auto flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <button onclick="toggleMenu()" class="text-2xl"><i class="fas fa-bars"></i></button>
                <h1 class="text-2xl font-black text-yellow-500 italic">GLOBAL</h1>
                <div onclick="toggleCart()" class="relative cursor-pointer">
                    <i class="fas fa-shopping-cart text-2xl"></i>
                    <span id="cartCount" class="absolute -top-2 -right-2 bg-yellow-500 text-black font-black rounded-full px-1.5 text-[10px]">0</span>
                </div>
            </div>
            <div class="relative w-full">
                <input type="text" id="searchInput" onkeyup="renderLocalProducts()" placeholder="¿Qué buscas hoy?" class="w-full p-2.5 pl-10 rounded-lg text-black outline-none shadow-md">
                <i class="fas fa-search absolute left-3 top-3.5 text-gray-400"></i>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4">
        <section id="catalogView">
            <div id="adminPanel" class="hidden bg-white p-6 rounded-2xl shadow-xl mb-8 border-2 border-yellow-500">
                <div class="flex justify-between items-center mb-4"><h2 id="adminActionTitle" class="font-black italic uppercase">Gestión de Producto</h2><button onclick="closeAdmin()" class="text-red-500 text-2xl">✕</button></div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="hidden" id="editId">
                    <input type="text" id="prodName" placeholder="Nombre" class="border p-3 rounded-lg w-full">
                    <div class="flex gap-2">
                        <input type="number" id="prodPrice" placeholder="Precio" class="border p-3 rounded-lg w-full">
                        <select id="prodCurrency" class="border p-3 rounded-lg font-bold">
                            <option value="C$">C$ NIO</option>
                            <option value="$">$ USD</option>
                        </select>
                    </div>
                    <input type="number" id="prodStock" placeholder="Stock" class="border p-3 rounded-lg w-full">
                    <input type="text" id="adminWhatsapp" placeholder="WhatsApp (Ej: 50588888888)" class="border p-3 rounded-lg w-full bg-yellow-50">
                    <textarea id="prodDesc" placeholder="Descripción..." class="border p-3 rounded-lg w-full md:col-span-2"></textarea>
                    <input type="file" id="prodFile" class="text-xs w-full">
                    <button onclick="saveToFirebase()" class="md:col-span-2 bg-slate-900 text-yellow-500 p-4 rounded-xl font-black uppercase flex justify-center items-center gap-3">
                        <span id="saveBtnText">GUARDAR PRODUCTO</span><div id="saveLoader" class="loader"></div>
                    </button>
                </div>
                <div class="mt-8 overflow-x-auto"><table class="w-full text-[11px] text-left"><tbody id="adminTableBody"></tbody></table></div>
            </div>

            <div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </section>

        <section id="historyView" class="hidden">
            <h2 class="text-xl font-black italic uppercase mb-6">Mis Pedidos Pasados</h2>
            <div id="historyList" class="space-y-3"></div>
        </section>
    </main>

    <div id="detailModal" class="fixed inset-0 bg-black/80 z-[4000] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl overflow-hidden relative">
            <button onclick="closeDetail()" class="absolute top-3 right-3 bg-white rounded-full w-8 h-8 font-bold shadow">✕</button>
            <img id="mImg" class="w-full h-64 object-contain bg-gray-100">
            <div class="p-6">
                <h2 id="mTitle" class="text-xl font-black uppercase mb-2"></h2>
                <p id="mDesc" class="text-sm text-gray-500 mb-4 h-20 overflow-y-auto"></p>
                <div class="flex justify-between items-center">
                    <span id="mPrice" class="text-2xl font-black text-slate-900"></span>
                    <button id="mBtn" class="bg-yellow-400 px-6 py-3 rounded-xl font-black uppercase text-xs">Añadir</button>
                </div>
            </div>
        </div>
    </div>

    <div id="cartModal" class="fixed right-0 top-0 h-full w-full md:w-80 bg-white shadow-2xl p-6 hidden z-[3000]">
        <div class="flex justify-between items-center mb-6 border-b pb-4 font-black">CARRITO <button onclick="toggleCart()" class="text-3xl">✕</button></div>
        <div id="cartItems" class="space-y-4 overflow-y-auto max-h-[60vh]"></div>
        <div class="absolute bottom-0 left-0 w-full p-6 border-t bg-gray-50 text-center">
            <div id="totalContainer" class="text-xl font-black mb-4">TOTAL: 0</div>
            <button onclick="sendOrder()" class="w-full bg-green-600 text-white py-4 rounded-xl font-black flex items-center justify-center gap-2">
                <i class="fab fa-whatsapp"></i> ENVIAR PEDIDO POR WHATSAPP
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, setDoc, getDoc } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFEw-S5KufBqeofyEqqnjCxbU7ElcqS2k",
            authDomain: "globaltienda-ad102.firebaseapp.com",
            projectId: "globaltienda-ad102",
            storageBucket: "globaltienda-ad102.firebasestorage.app",
            messagingSenderId: "221802932744",
            appId: "1:221802932744:web:ca20e8940a77164406ffbd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const prodsRef = collection(db, "productos");
        const configRef = doc(db, "configuracion", "seguridad");

        window.allProducts = [];
        let currentPass = "1234";

        onSnapshot(configRef, (s) => { if(s.exists()) currentPass = s.data().pass; });

        window.accessAdmin = () => { if(prompt("Pass:") === currentPass) { document.getElementById('adminPanel').classList.remove('hidden'); toggleMenu(); } };

        onSnapshot(query(prodsRef, orderBy("timestamp", "desc")), (s) => {
            window.allProducts = [];
            s.forEach((d) => { window.allProducts.push({ id: d.id, ...d.data() }); });
            renderLocalProducts(); renderAdminTable();
        });

        window.saveToFirebase = async () => {
            const id = document.getElementById('editId').value;
            const waField = document.getElementById('adminWhatsapp').value;
            if(waField) localStorage.setItem('global_wa', waField.replace(/\D/g,''));

            const data = { 
                name: document.getElementById('prodName').value,
                price: document.getElementById('prodPrice').value,
                currency: document.getElementById('prodCurrency').value,
                stock: parseInt(document.getElementById('prodStock').value) || 0,
                desc: document.getElementById('prodDesc').value,
                timestamp: Date.now()
            };
            
            const file = document.getElementById('prodFile').files[0];
            document.getElementById('saveLoader').style.display = 'block';

            const run = async (img) => {
                if(img) data.img = img;
                if(id) await updateDoc(doc(db, "productos", id), data); else await addDoc(prodsRef, data);
                closeAdmin(); document.getElementById('saveLoader').style.display = 'none';
            };
            if(file) { const r = new FileReader(); r.onload = (e) => run(e.target.result); r.readAsDataURL(file); } else run(null);
        };

        window.reduceStock = async (items) => {
            for(const item of items) {
                const ref = doc(db, "productos", item.id);
                const s = await getDoc(ref);
                if(s.exists()) await updateDoc(ref, { stock: Math.max(0, s.data().stock - 1) });
            }
        };

        window.deleteFromFirebase = async (id) => { if(confirm("¿Borrar?")) await deleteDoc(doc(db, "productos", id)); };
    </script>

    <script>
        let cart = [];
        let historyData = JSON.parse(localStorage.getItem('global_history')) || [];

        function toggleMenu() { document.getElementById('sideMenu').classList.toggle('active'); }
        function toggleCart() { document.getElementById('cartModal').classList.toggle('hidden'); }
        function closeDetail() { document.getElementById('detailModal').classList.add('hidden'); }

        function showView(v) {
            document.getElementById('catalogView').classList.toggle('hidden', v !== 'catalog');
            document.getElementById('historyView').classList.toggle('hidden', v !== 'history');
            if(v === 'history') renderHistory();
            toggleMenu();
        }

        function renderLocalProducts() {
            const grid = document.getElementById('productGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';
            window.allProducts.filter(p => p.name.toLowerCase().includes(search)).forEach(p => {
                const out = p.stock <= 0;
                grid.innerHTML += `
                <div class="product-card" onclick="openDetail('${p.id}')">
                    <img src="${p.img || 'https://via.placeholder.com/150'}">
                    <div class="p-3">
                        <h3 class="font-bold text-[11px] uppercase line-clamp-2 h-8">${p.name}</h3>
                        <p class="text-[10px] font-black ${out?'text-red-500':'text-green-600'}">${out?'AGOTADO':'STOCK: '+p.stock}</p>
                        <p class="text-lg font-black text-slate-900">${p.currency}${p.price}</p>
                        <button onclick="event.stopPropagation(); addToCart('${p.id}')" ${out?'disabled':''} class="w-full mt-2 py-2 rounded-lg font-black text-[10px] ${out?'bg-gray-200':'bg-yellow-400'}">AÑADIR</button>
                    </div>
                </div>`;
            });
        }

        function openDetail(id) {
            const p = window.allProducts.find(x => x.id === id);
            document.getElementById('mTitle').innerText = p.name;
            document.getElementById('mDesc').innerText = p.desc || "Sin descripción.";
            document.getElementById('mPrice').innerText = `${p.currency}${p.price}`;
            document.getElementById('mImg').src = p.img || 'https://via.placeholder.com/300';
            const btn = document.getElementById('mBtn');
            btn.disabled = p.stock <= 0;
            btn.onclick = () => { addToCart(p.id); closeDetail(); };
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function addToCart(id) { 
            const p = window.allProducts.find(x => x.id === id); 
            if(p && p.stock > 0) { cart.push({...p}); updateCartUI(); } 
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const items = document.getElementById('cartItems'); items.innerHTML = '';
            let resumenTotal = {}; 
            cart.forEach((p, i) => { 
                resumenTotal[p.currency] = (resumenTotal[p.currency] || 0) + parseFloat(p.price);
                items.innerHTML += `<div class="flex justify-between text-xs bg-gray-50 p-2 rounded"><span>${p.name}</span><button onclick="removeFromCart(${i})" class="text-red-500 font-bold">✕</button></div>`; 
            });
            let totalTxt = "";
            for (const key in resumenTotal) { totalTxt += `${key}${resumenTotal[key].toFixed(2)} `; }
            document.getElementById('totalContainer').innerText = cart.length > 0 ? `TOTAL: ${totalTxt}` : "TOTAL: 0";
        }

        function removeFromCart(i) { cart.splice(i, 1); updateCartUI(); }

        // SOLUCIÓN DEFINITIVA WHATSAPP (PC Y MÓVIL)
        async function sendOrder() {
            let wa = localStorage.getItem('global_wa');
            if(!wa || wa === "") {
                alert("Por favor, el administrador debe configurar un número de WhatsApp en el Panel Admin.");
                return;
            }

            if(cart.length === 0) {
                alert("Carrito vacío.");
                return;
            }

            const dir = document.getElementById('manualAddress').value;
            const total = document.getElementById('totalContainer').innerText;
            
            // Mensaje formateado
            let message = `🛍️ *NUEVO PEDIDO - GLOBAL*\n\n`;
            message += cart.map(p => `• ${p.name} (${p.currency}${p.price})`).join('\n');
            message += `\n\n*${total}*`;
            if(dir) message += `\n\n🏠 *Dirección:* ${dir}`;

            // Reducir Stock en Firebase
            await window.reduceStock(cart);
            
            // Guardar Historial
            historyData.unshift({ fecha: new Date().toLocaleString(), total: total, resumen: cart.map(p => p.name).join(', ') });
            localStorage.setItem('global_history', JSON.stringify(historyData));

            // URL Universal de WhatsApp (api.whatsapp.com es la que mejor funciona en PC y Móvil)
            const finalUrl = `https://api.whatsapp.com/send?phone=${wa}&text=${encodeURIComponent(message)}`;
            
            window.open(finalUrl, '_blank');
            
            cart = []; 
            updateCartUI(); 
            toggleCart();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = historyData.length === 0 ? '<p class="text-gray-400">No hay pedidos.</p>' : '';
            historyData.forEach(h => {
                list.innerHTML += `<div class="bg-white p-3 rounded-lg shadow-sm border-l-4 border-yellow-500 text-xs"><b>${h.fecha}</b><br>${h.resumen}<br><span class="text-green-600 font-bold">${h.total}</span></div>`;
            });
        }

        function renderAdminTable() {
            const tb = document.getElementById('adminTableBody'); if(!tb) return; tb.innerHTML = '';
            window.allProducts.forEach(p => {
                tb.innerHTML += `<tr class="border-b"><td class="p-2">${p.name}</td><td class="p-2 flex gap-2"><button onclick="loadToEdit('${p.id}')" class="text-blue-600">Edit</button><button onclick="deleteFromFirebase('${p.id}')" class="text-red-500">X</button></td></tr>`;
            });
        }

        function loadToEdit(id) {
            const p = window.allProducts.find(x => x.id === id);
            document.getElementById('editId').value = p.id;
            document.getElementById('prodName').value = p.name;
            document.getElementById('prodPrice').value = p.price;
            document.getElementById('prodCurrency').value = p.currency;
            document.getElementById('prodStock').value = p.stock;
            document.getElementById('prodDesc').value = p.desc || "";
            document.getElementById('adminActionTitle').innerText = "Editando...";
            window.scrollTo(0,0);
        }

        function closeAdmin() { 
            document.getElementById('adminPanel').classList.add('hidden'); 
            document.getElementById('editId').value = "";
            document.getElementById('prodName').value = "";
            document.getElementById('prodPrice').value = "";
            document.getElementById('prodStock').value = "";
            document.getElementById('prodDesc').value = "";
        }
    </script>
</body>
</html>
