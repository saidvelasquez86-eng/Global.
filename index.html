<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL V0.5.8 | Cloud Security</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .product-card { border: 1px solid #eee; transition: 0.2s; background: white; border-radius: 15px; overflow: hidden; }
        #sideMenu { transition: 0.3s; left: -100%; z-index: 1000; }
        #sideMenu.active { left: 0; }
        .amazon-gradient { background: #131921; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #fbbf24; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <div id="sideMenu" class="fixed top-0 h-full w-72 bg-slate-900 text-white p-5 shadow-2xl z-[2000]">
        <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4 text-yellow-500 font-black text-2xl italic">GLOBAL <button onclick="toggleMenu()" class="text-white text-3xl">×</button></div>
        <nav class="space-y-4 font-bold">
            <button onclick="showView('catalog')" class="w-full text-left p-3 hover:bg-slate-800 rounded-lg flex items-center gap-3"><i class="fas fa-home text-yellow-500"></i> Inicio</button>
            <div class="mt-6 p-4 bg-slate-800 rounded-xl text-xs">
                <p class="text-gray-400 uppercase mb-2 italic">Dirección de Entrega</p>
                <textarea id="manualAddress" placeholder="Tu dirección aquí..." class="w-full bg-slate-700 text-white p-2 rounded-lg h-20 outline-none"></textarea>
            </div>
            <button onclick="accessAdmin()" class="w-full text-left p-3 text-red-400 mt-10 border-t border-gray-800 pt-6 flex items-center gap-3"><i class="fas fa-lock"></i> Panel Admin</button>
        </nav>
    </div>

    <header class="amazon-gradient text-white sticky top-0 z-50 p-4">
        <div class="max-w-6xl mx-auto flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <button onclick="toggleMenu()" class="text-2xl"><i class="fas fa-bars"></i></button>
                <h1 class="text-2xl font-black text-yellow-500 italic">GLOBAL</h1>
                <div onclick="toggleCart()" class="relative cursor-pointer">
                    <i class="fas fa-shopping-cart text-2xl"></i>
                    <span id="cartCount" class="absolute -top-2 -right-2 bg-yellow-500 text-black font-black rounded-full px-1.5 text-[10px]">0</span>
                </div>
            </div>
            <div class="relative w-full">
                <input type="text" id="searchInput" onkeyup="renderLocalProducts()" placeholder="¿Qué buscas hoy?" class="w-full p-2.5 pl-10 rounded-lg text-black outline-none shadow-md">
                <i class="fas fa-search absolute left-3 top-3.5 text-gray-400"></i>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4">
        <section id="catalogView">
            <div id="adminPanel" class="hidden bg-white p-6 rounded-2xl shadow-xl mb-8 border-2 border-yellow-500">
                <div class="flex justify-between items-center mb-6"><h2 class="font-black italic uppercase">Configuración</h2><button onclick="closeAdmin()" class="text-red-500 text-2xl">✕</button></div>
                
                <div class="mb-6 p-4 bg-blue-50 rounded-xl border border-blue-200">
                    <p class="text-[10px] font-bold text-blue-600 uppercase mb-2">Seguridad (Contraseña de Administración)</p>
                    <div class="flex gap-2">
                        <input type="text" id="newAdminPass" placeholder="Nueva Clave" class="border p-2 rounded-lg w-full text-sm">
                        <button onclick="updateCloudPassword()" class="bg-blue-600 text-white px-4 rounded-lg text-xs font-bold hover:bg-blue-700">GUARDAR CLAVE</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="hidden" id="editId">
                    <input type="text" id="prodName" placeholder="Nombre del Producto" class="border p-3 rounded-lg w-full">
                    <div class="flex gap-2">
                        <input type="number" id="prodPrice" placeholder="Precio" class="border p-3 rounded-lg w-full">
                        <select id="prodCurrency" class="border p-3 rounded-lg"><option value="$">$ USD</option><option value="C$">C$ NIO</option></select>
                    </div>
                    <input type="number" id="prodStock" placeholder="Stock" class="border p-3 rounded-lg w-full">
                    <input type="text" id="adminWhatsapp" placeholder="Número WhatsApp (Ej: 50588888888)" class="border p-3 rounded-lg w-full bg-yellow-50">
                    <input type="file" id="prodFile" class="text-xs w-full">
                    <button onclick="saveToFirebase()" class="md:col-span-2 bg-slate-900 text-yellow-500 p-4 rounded-xl font-black uppercase flex justify-center items-center gap-3">
                        <span id="saveBtnText">GUARDAR PRODUCTO</span><div id="saveLoader" class="loader"></div>
                    </button>
                </div>

                <div class="mt-8 overflow-x-auto">
                    <table class="w-full text-[11px] text-left"><tbody id="adminTableBody"></tbody></table>
                </div>
            </div>
            <div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </section>
    </main>

    <div id="cartModal" class="fixed right-0 top-0 h-full w-full md:w-80 bg-white shadow-2xl p-6 hidden z-[3000]">
        <div class="flex justify-between items-center mb-6 border-b pb-4 font-black">CARRITO <button onclick="toggleCart()" class="text-3xl">✕</button></div>
        <div id="cartItems" class="space-y-4 overflow-y-auto max-h-[60vh]"></div>
        <div class="absolute bottom-0 left-0 w-full p-6 border-t bg-gray-50">
            <div id="totalContainer" class="text-xl font-black mb-4"></div>
            <button onclick="sendOrder()" class="w-full bg-green-600 text-white py-4 rounded-xl font-black flex items-center justify-center gap-2 uppercase">
                <i class="fab fa-whatsapp"></i> PEDIR POR WHATSAPP
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, setDoc, getDoc } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFEw-S5KufBqeofyEqqnjCxbU7ElcqS2k",
            authDomain: "globaltienda-ad102.firebaseapp.com",
            projectId: "globaltienda-ad102",
            storageBucket: "globaltienda-ad102.firebasestorage.app",
            messagingSenderId: "221802932744",
            appId: "1:221802932744:web:ca20e8940a77164406ffbd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const prodsRef = collection(db, "productos");
        const configRef = doc(db, "configuracion", "seguridad");

        window.allProducts = [];
        let currentPass = "1234";

        // Escuchar cambios de clave en la nube
        onSnapshot(configRef, (docSnap) => {
            if(docSnap.exists()) {
                currentPass = docSnap.data().pass;
                console.log("Clave cargada desde la nube.");
            }
        });

        // FUNCION PARA CAMBIAR CLAVE
        window.updateCloudPassword = async () => {
            const newP = document.getElementById('newAdminPass').value;
            if(!newP) return alert("Escribe la nueva clave primero.");
            try {
                await setDoc(configRef, { pass: newP }, { merge: true });
                alert("¡Éxito! La nueva contraseña es: " + newP);
                document.getElementById('newAdminPass').value = "";
            } catch (e) {
                alert("Error al guardar: " + e.message);
            }
        };

        window.accessAdmin = () => {
            const pass = prompt("Introduce la clave de administrador:");
            if(pass === currentPass) {
                document.getElementById('adminPanel').classList.remove('hidden');
                toggleMenu();
            } else if (pass !== null) {
                alert("Clave incorrecta.");
            }
        };

        onSnapshot(query(prodsRef, orderBy("timestamp", "desc")), (s) => {
            window.allProducts = [];
            s.forEach((d) => { window.allProducts.push({ id: d.id, ...d.data() }); });
            renderLocalProducts();
            renderAdminTable();
        });

        window.saveToFirebase = async () => {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('prodName').value;
            const price = document.getElementById('prodPrice').value;
            const stock = parseInt(document.getElementById('prodStock').value) || 0;
            const wa = document.getElementById('adminWhatsapp').value;
            const file = document.getElementById('prodFile').files[0];
            
            if(!name || !price) return alert("Nombre y precio son necesarios.");
            document.getElementById('saveLoader').style.display = 'block';

            const runSave = async (img64) => {
                const data = { name, price, currency: document.getElementById('prodCurrency').value, stock, timestamp: Date.now() };
                if(img64) data.img = img64;
                if(id) await updateDoc(doc(db, "productos", id), data); else await addDoc(prodsRef, data);
                if(wa) localStorage.setItem('global_wa', wa);
                closeAdmin();
                document.getElementById('saveLoader').style.display = 'none';
            };

            if(file) { const r = new FileReader(); r.onload = (e) => runSave(e.target.result); r.readAsDataURL(file); } 
            else { runSave(null); }
        };

        window.reduceStock = async (items) => {
            for(const item of items) {
                const ref = doc(db, "productos", item.id);
                const s = await getDoc(ref);
                if(s.exists() && s.data().stock > 0) await updateDoc(ref, { stock: s.data().stock - 1 });
            }
        };

        window.deleteFromFirebase = async (id) => { if(confirm("¿Eliminar este producto?")) await deleteDoc(doc(db, "productos", id)); };
    </script>

    <script>
        let cart = [];
        function toggleMenu() { document.getElementById('sideMenu').classList.toggle('active'); }
        function toggleCart() { document.getElementById('cartModal').classList.toggle('hidden'); }
        function showView(v) { document.getElementById('catalogView').classList.remove('hidden'); toggleMenu(); }

        function renderLocalProducts() {
            const grid = document.getElementById('productGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';
            window.allProducts.filter(p => p.name.toLowerCase().includes(search)).forEach(p => {
                const out = p.stock <= 0;
                grid.innerHTML += `
                <div class="product-card flex flex-col shadow-sm border ${out?'grayscale opacity-60':''}">
                    <img src="${p.img || 'https://via.placeholder.com/150'}" class="w-full h-40 object-cover">
                    <div class="p-3">
                        <h3 class="font-bold text-[10px] uppercase line-clamp-2 h-8">${p.name}</h3>
                        <p class="text-[10px] font-black ${out?'text-red-500':'text-green-600'}">${out?'AGOTADO':'DISPONIBLES: '+p.stock}</p>
                        <p class="text-lg font-black mt-1">${p.currency}${p.price}</p>
                        <button onclick="addToCart('${p.id}')" ${out?'disabled':''} class="w-full mt-2 py-2 rounded-lg font-black text-[10px] ${out?'bg-gray-200 text-gray-400':'bg-yellow-400'}">AÑADIR</button>
                    </div>
                </div>`;
            });
        }

        function addToCart(id) { const p = window.allProducts.find(x => x.id === id); cart.push({...p}); updateCartUI(); }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const items = document.getElementById('cartItems');
            items.innerHTML = '';
            let total = 0, curr = "";
            cart.forEach((p, i) => { total += parseFloat(p.price); curr = p.currency; items.innerHTML += `<div class="flex justify-between items-center text-[10px] border-b pb-2"><span>${p.name}</span><button onclick="removeFromCart(${i})" class="text-red-500 font-bold text-lg">✕</button></div>`; });
            document.getElementById('totalContainer').innerText = `TOTAL: ${curr}${total.toFixed(2)}`;
        }

        function removeFromCart(i) { cart.splice(i, 1); updateCartUI(); }

        async function sendOrder() {
            const wa = localStorage.getItem('global_wa');
            if(!wa) return alert("Falta el número de WhatsApp en Admin");
            const dir = document.getElementById('manualAddress').value;
            const list = cart.map(p => `• ${p.name}`).join('%0A');
            const total = document.getElementById('totalContainer').innerText;
            
            await window.reduceStock(cart);
            let txt = `🛍️ *NUEVO PEDIDO - GLOBAL*%0A%0A${list}%0A%0A*${total}*%0A`;
            if(dir) txt += `%0A🏠 *Dirección:* ${dir}`;
            
            window.open(`https://wa.me/${wa}?text=${txt}`, '_blank');
            cart = []; updateCartUI(); toggleCart();
        }

        function renderAdminTable() {
            const tb = document.getElementById('adminTableBody');
            if(!tb) return; tb.innerHTML = '';
            window.allProducts.forEach(p => {
                tb.innerHTML += `<tr class="border-b"><td class="p-2">${p.name} (${p.stock})</td><td class="p-2 flex gap-3"><button onclick="loadToEdit('${p.id}')" class="text-blue-600 font-bold uppercase">Editar</button><button onclick="deleteFromFirebase('${p.id}')" class="text-red-500 font-bold uppercase">X</button></td></tr>`;
            });
        }

        function loadToEdit(id) {
            const p = window.allProducts.find(x => x.id === id);
            document.getElementById('editId').value = p.id;
            document.getElementById('prodName').value = p.name;
            document.getElementById('prodPrice').value = p.price;
            document.getElementById('prodStock').value = p.stock;
            document.getElementById('adminActionTitle').innerText = "Editando...";
            window.scrollTo(0,0);
        }

        function closeAdmin() { document.getElementById('adminPanel').classList.add('hidden'); document.getElementById('editId').value = ""; }
    </script>
</body>
</html>
