<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL V0.5.3 | Pedidos OK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .product-card { border: 1px solid #eee; transition: 0.2s; background: white; border-radius: 15px; overflow: hidden; }
        #sideMenu { transition: 0.3s; left: -100%; z-index: 1000; }
        #sideMenu.active { left: 0; }
        .amazon-gradient { background: #131921; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #fbbf24; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <div id="sideMenu" class="fixed top-0 h-full w-72 bg-slate-900 text-white p-5 shadow-2xl overflow-y-auto">
        <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
            <h2 class="text-2xl font-black text-yellow-500 italic">GLOBAL</h2>
            <button onclick="toggleMenu()" class="text-3xl">×</button>
        </div>
        <nav class="space-y-4 font-bold">
            <button onclick="showView('catalog')" class="w-full text-left p-3 hover:bg-slate-800 rounded-lg flex items-center gap-3"><i class="fas fa-home text-yellow-500"></i> Inicio</button>
            <button onclick="showView('history')" class="w-full text-left p-3 hover:bg-slate-800 rounded-lg flex items-center gap-3"><i class="fas fa-history text-yellow-500"></i> Mi Historial</button>
            <div class="mt-6 p-4 bg-slate-800 rounded-xl text-xs">
                <p class="text-gray-400 uppercase mb-2">Opciones de Entrega</p>
                <textarea id="manualAddress" placeholder="Escribe tu dirección aquí..." class="w-full bg-slate-700 text-white p-2 rounded-lg h-20 outline-none mb-2"></textarea>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="gpsToggle" checked class="accent-yellow-500"> Enviar Ubicación GPS</label>
            </div>
            <button onclick="accessAdmin()" class="w-full text-left p-3 text-red-400 mt-10 border-t border-gray-800 pt-6 flex items-center gap-3"><i class="fas fa-lock"></i> Panel Admin</button>
        </nav>
    </div>

    <header class="amazon-gradient text-white sticky top-0 z-50 p-4 shadow-lg">
        <div class="flex justify-between items-center max-w-6xl mx-auto">
            <button onclick="toggleMenu()" class="text-2xl"><i class="fas fa-bars"></i></button>
            <h1 class="text-2xl font-black text-yellow-500 italic">GLOBAL</h1>
            <div onclick="toggleCart()" class="relative cursor-pointer">
                <i class="fas fa-shopping-cart text-2xl"></i>
                <span id="cartCount" class="absolute -top-2 -right-2 bg-yellow-500 text-black font-black rounded-full px-1.5 text-[10px]">0</span>
            </div>
        </div>
        <input type="text" id="searchInput" onkeyup="renderLocalProducts()" placeholder="¿Qué estás buscando?" class="w-full mt-3 p-2 rounded-lg text-black outline-none">
    </header>

    <main class="max-w-6xl mx-auto p-4">
        <section id="catalogView">
            <div id="adminPanel" class="hidden bg-white p-6 rounded-2xl shadow-xl mb-8 border-2 border-yellow-500">
                <div class="flex justify-between items-center mb-4"><h2 class="font-black">PANEL ADMIN</h2><button onclick="closeAdmin()" class="text-red-500">✕</button></div>
                <div class="grid gap-3">
                    <input type="hidden" id="editId">
                    <input type="text" id="prodName" placeholder="Nombre" class="border p-2 rounded w-full">
                    <input type="number" id="prodPrice" placeholder="Precio" class="border p-2 rounded w-full">
                    <select id="prodCurrency" class="border p-2 rounded w-full"><option value="$">$ USD</option><option value="C$">C$ NIO</option></select>
                    <input type="number" id="prodStock" placeholder="Stock" class="border p-2 rounded w-full">
                    <textarea id="prodDesc" placeholder="Descripción" class="border p-2 rounded w-full h-16"></textarea>
                    <input type="file" id="prodFile" class="text-xs">
                    <p class="text-[10px] text-red-500 font-bold mt-2">NÚMERO DE WHATSAPP RECEPTOR:</p>
                    <input type="text" id="adminWhatsapp" placeholder="Ej: 50588888888" class="border p-2 rounded w-full bg-yellow-50">
                    <button onclick="saveToFirebase()" class="bg-slate-900 text-yellow-500 p-3 rounded-xl font-black uppercase flex justify-center gap-2">
                        <span>GUARDAR</span><div id="saveLoader" class="loader"></div>
                    </button>
                </div>
                <div class="mt-4 overflow-x-auto"><table class="w-full text-[10px]"><tbody id="adminTableBody"></tbody></table></div>
            </div>
            <div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </section>

        <section id="historyView" class="hidden">
            <h2 class="text-xl font-black italic mb-4 uppercase">Mis Pedidos</h2>
            <div id="historyList" class="space-y-3"></div>
        </section>
    </main>

    <div id="productDetailModal" class="fixed inset-0 bg-black/80 z-[1100] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl overflow-hidden shadow-2xl relative">
            <button onclick="closeDetail()" class="absolute top-3 right-3 bg-white/80 rounded-full w-8 h-8 font-bold">✕</button>
            <img id="detailImg" class="w-full h-64 object-cover">
            <div class="p-6">
                <h2 id="detailTitle" class="text-xl font-black uppercase"></h2>
                <div id="detailPrice" class="text-xl font-bold text-orange-600 mb-2"></div>
                <p id="detailFullDesc" class="text-gray-600 text-sm mb-6"></p>
                <div id="detailActionBtn"></div>
            </div>
        </div>
    </div>

    <div id="cartModal" class="fixed right-0 top-0 h-full w-full md:w-80 bg-white shadow-2xl p-6 hidden z-[1200]">
        <div class="flex justify-between items-center mb-6 border-b pb-4"><h2 class="font-black italic">TU COMPRA</h2><button onclick="toggleCart()" class="text-3xl">✕</button></div>
        <div id="cartItems" class="space-y-4 overflow-y-auto max-h-[60vh]"></div>
        <div class="absolute bottom-0 left-0 w-full p-6 border-t bg-gray-50">
            <div id="totalContainer" class="text-xl font-black mb-4 text-center"></div>
            <button onclick="sendOrder()" class="w-full bg-green-600 text-white py-4 rounded-xl font-black flex items-center justify-center gap-2 uppercase">
                <i class="fab fa-whatsapp text-xl"></i> PEDIR POR WHATSAPP
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFEw-S5KufBqeofyEqqnjCxbU7ElcqS2k",
            authDomain: "globaltienda-ad102.firebaseapp.com",
            projectId: "globaltienda-ad102",
            storageBucket: "globaltienda-ad102.firebasestorage.app",
            messagingSenderId: "221802932744",
            appId: "1:221802932744:web:ca20e8940a77164406ffbd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const prodsRef = collection(db, "productos");

        window.allProducts = [];

        onSnapshot(query(prodsRef, orderBy("timestamp", "desc")), (snapshot) => {
            window.allProducts = [];
            snapshot.forEach((doc) => { window.allProducts.push({ id: doc.id, ...doc.data() }); });
            renderLocalProducts();
            renderAdminTable();
        });

        window.saveToFirebase = async function() {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('prodName').value;
            const price = document.getElementById('prodPrice').value;
            const currency = document.getElementById('prodCurrency').value;
            const stock = document.getElementById('prodStock').value;
            const desc = document.getElementById('prodDesc').value;
            const wa = document.getElementById('adminWhatsapp').value;
            const file = document.getElementById('prodFile').files[0];

            if(!name || !price) return alert("Nombre y Precio obligatorios");
            document.getElementById('saveLoader').style.display = 'block';

            const saveData = async (img64) => {
                const data = { name, price, currency, stock: stock===""?"inf":parseInt(stock), desc, timestamp: Date.now() };
                if(img64) data.img = img64;
                if(id) await updateDoc(doc(db, "productos", id), data);
                else await addDoc(prodsRef, data);
                if(wa) localStorage.setItem('global_wa', wa);
                closeAdmin();
                document.getElementById('saveLoader').style.display = 'none';
            };

            if(file) {
                const r = new FileReader(); r.onload = (e) => saveData(e.target.result); r.readAsDataURL(file);
            } else { saveData(null); }
        }

        window.deleteFromFirebase = async (id) => { if(confirm("¿Borrar producto?")) await deleteDoc(doc(db, "productos", id)); }
    </script>

    <script>
        let cart = [];
        let history = JSON.parse(localStorage.getItem('global_history')) || [];

        function toggleMenu() { document.getElementById('sideMenu').classList.toggle('active'); }
        function toggleCart() { document.getElementById('cartModal').classList.toggle('hidden'); }
        function showView(view) {
            document.getElementById('catalogView').classList.toggle('hidden', view !== 'catalog');
            document.getElementById('historyView').classList.toggle('hidden', view !== 'history');
            if(view === 'history') renderHistory();
            toggleMenu();
        }

        function renderLocalProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            window.allProducts.forEach(p => {
                const agotado = (p.stock !== "inf" && p.stock <= 0);
                grid.innerHTML += `
                <div class="product-card">
                    <img src="${p.img || 'https://via.placeholder.com/150'}" class="w-full h-36 object-cover cursor-pointer" onclick="openDetail('${p.id}')">
                    <div class="p-3">
                        <h3 class="font-bold text-[10px] uppercase line-clamp-2 h-8">${p.name}</h3>
                        <p class="text-xs font-bold ${agotado?'text-red-500':'text-green-600'}">STOCK: ${p.stock}</p>
                        <p class="text-lg font-black">${p.currency}${p.price}</p>
                        <button onclick="addToCart('${p.id}')" ${agotado?'disabled':''} class="w-full mt-2 py-2 rounded-lg font-bold text-[10px] ${agotado?'bg-gray-100 text-gray-400':'bg-yellow-400 hover:bg-yellow-500'}">
                            ${agotado ? 'AGOTADO' : 'AÑADIR'}
                        </button>
                    </div>
                </div>`;
            });
        }

        function openDetail(id) {
            const p = window.allProducts.find(x => x.id === id);
            document.getElementById('detailTitle').innerText = p.name;
            document.getElementById('detailImg').src = p.img || 'https://via.placeholder.com/300';
            document.getElementById('detailPrice').innerText = `${p.currency}${p.price}`;
            document.getElementById('detailFullDesc').innerText = p.desc || 'Sin descripción disponible.';
            const agotado = (p.stock !== "inf" && p.stock <= 0);
            document.getElementById('detailActionBtn').innerHTML = `<button onclick="addToCart('${p.id}')" ${agotado?'disabled':''} class="w-full py-4 rounded-xl font-black ${agotado?'bg-gray-200':'bg-yellow-400 shadow-lg'} uppercase">${agotado?'SIN STOCK':'COMPRAR AHORA'}</button>`;
            document.getElementById('productDetailModal').classList.remove('hidden');
        }

        function addToCart(id) {
            const p = window.allProducts.find(x => x.id === id);
            cart.push({...p});
            updateCartUI();
            closeDetail();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const items = document.getElementById('cartItems');
            items.innerHTML = '';
            let tUSD = 0, tNIO = 0;
            cart.forEach((p, i) => {
                if(p.currency === "$") tUSD += parseFloat(p.price); else tNIO += parseFloat(p.price);
                items.innerHTML += `<div class="flex justify-between items-center text-[10px] border-b pb-2"><span>${p.name}</span><button onclick="removeFromCart(${i})" class="text-red-500 font-bold">✕</button></div>`;
            });
            document.getElementById('totalContainer').innerText = `TOTAL: ${(tUSD > 0 ? `$${tUSD.toFixed(2)} ` : '')} ${(tNIO > 0 ? `C$${tNIO.toFixed(2)}` : '')}`;
        }

        function removeFromCart(i) { cart.splice(i, 1); updateCartUI(); }

        function sendOrder() {
            const wa = localStorage.getItem('global_wa');
            if(!wa || wa === "") return alert("Configura el número de WhatsApp en el Panel Admin primero.");
            if(cart.length === 0) return alert("El carrito está vacío.");

            const gps = document.getElementById('gpsToggle').checked;
            const dir = document.getElementById('manualAddress').value;

            if(gps && navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => finalizeOrder(wa, pos.coords.latitude, pos.coords.longitude, dir),
                    () => finalizeOrder(wa, null, null, dir)
                );
            } else { finalizeOrder(wa, null, null, dir); }
        }

        function finalizeOrder(wa, lat, lon, dir) {
            const total = document.getElementById('totalContainer').innerText;
            const listado = cart.map(p => `- ${p.name} (${p.currency}${p.price})`).join('%0A');
            
            // Guardar en historial
            const pedido = { fecha: new Date().toLocaleString(), total: total, resumen: cart.map(p => p.name).join(', ') };
            history.unshift(pedido);
            localStorage.setItem('global_history', JSON.stringify(history));

            let texto = `🛍️ *NUEVO PEDIDO - GLOBAL*%0A%0A${listado}%0A%0A*${total}*%0A`;
            if(dir) texto += `%0A🏠 *Dirección:* ${dir}`;
            if(lat) texto += `%0A📍 *Ubicación:* https://www.google.com/maps?q=${lat},${lon}`;
            
            window.open(`https://wa.me/${wa}?text=${texto}`, '_blank');
            cart = []; updateCartUI(); toggleCart();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = history.length === 0 ? '<p class="text-center text-gray-400 py-10">No hay pedidos registrados.</p>' : '';
            history.forEach(h => {
                list.innerHTML += `<div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-yellow-500"><p class="text-[8px] text-gray-400">${h.fecha}</p><p class="text-xs font-bold uppercase">${h.resumen}</p><p class="text-green-600 font-black">${h.total}</p></div>`;
            });
        }

        function accessAdmin() { if(prompt("Contraseña:") === "1234") { document.getElementById('adminPanel').classList.remove('hidden'); toggleMenu(); } }
        function closeAdmin() { document.getElementById('adminPanel').classList.add('hidden'); }
        function closeDetail() { document.getElementById('productDetailModal').classList.add('hidden'); }

        function renderAdminTable() {
            const tb = document.getElementById('adminTableBody');
            if(!tb) return;
            tb.innerHTML = '';
            window.allProducts.forEach(p => {
                tb.innerHTML += `<tr class="border-b"><td class="p-2">${p.name}</td><td class="p-2 flex gap-2"><button onclick="editProduct('${p.id}')" class="text-blue-500">E</button><button onclick="deleteFromFirebase('${p.id}')" class="text-red-500">X</button></td></tr>`;
            });
        }

        function editProduct(id) {
            const p = window.allProducts.find(x => x.id === id);
            document.getElementById('editId').value = p.id;
            document.getElementById('prodName').value = p.name;
            document.getElementById('prodPrice').value = p.price;
            document.getElementById('prodStock').value = p.stock === "inf" ? "" : p.stock;
            document.getElementById('prodDesc').value = p.desc;
        }
    </script>
</body>
</html>
